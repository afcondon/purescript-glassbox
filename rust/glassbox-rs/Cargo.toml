[package]
name = "glassbox"
version = "0.1.0"
edition = "2021"
description = "A state machine as a data artifact: the Rust runtime, held to the PureScript one by generated vectors"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
