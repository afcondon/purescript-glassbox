package:
  name: glassbox
  description: "A state machine as a data artifact: run it, describe it, and hand it to somebody who does not write PureScript"
  dependencies:
    - argonaut-core: ">=7.0.0 <8.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - codec: ">=6.1.0 <7.0.0"
    - codec-argonaut: ">=10.0.0 <11.0.0"
    - either: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Main
    dependencies:
      - console
      - effect
      - exceptions
      - lists
      - node-fs
      - node-process
      - quickcheck
      - random
      - transformers
